name: Publish True Motion preview

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full commit SHA to build and release'
        required: true
        type: string
      tag:
        description: 'Version tag, matching version.properties (for example v0.15.0)'
        required: true
        type: string
      prepared_apk_commit:
        description: 'Optional commit containing release.apk, signed with the pinned preview certificate'
        type: string
        default: ''
      prepared_apk_sha256:
        description: 'SHA-256 of the prepared APK (required with prepared_apk_commit)'
        type: string
        default: ''
      prepare_only:
        description: 'Build and test an unsigned APK for offline signing; do not publish'
        type: boolean
        default: false
      validated_run:
        description: 'Optional successful prepare-only run ID whose exact tested payload is being signed'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREPARED_COMMIT: ${{ inputs.prepared_apk_commit }}
      PREPARED_SHA256: ${{ inputs.prepared_apk_sha256 }}
      PREPARE_ONLY: ${{ inputs.prepare_only }}
      VALIDATED_RUN: ${{ inputs.validated_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 2
      - name: Validate source and version
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          source = os.environ['SOURCE_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Use a full commit SHA'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          version = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if '=' in line)['versionName']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Unsupported version'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match the source version'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('RELEASE_VERSION=' + version + '\n')
          PY
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Audit, test and build
        if: inputs.validated_run == ''
        env:
          PREVIEW_KEYSTORE: ${{ secrets.TRUE_MOTION_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 tools/source_audit.py
          python3 tools/verify_native.py
          bash tools/test_depth_renderer.sh
          python3 -m unittest discover -s tests/tools
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          if os.environ['PREPARE_ONLY'] == 'true':
              assert not os.environ['VALIDATED_RUN'], 'Preparation must perform a fresh build'
          elif os.environ['PREPARED_COMMIT']:
              assert re.fullmatch(r'[0-9a-f]{40}', os.environ['PREPARED_COMMIT'])
              assert re.fullmatch(r'[0-9a-f]{64}', os.environ['PREPARED_SHA256'])
          else:
              key = os.environ.get('PREVIEW_KEYSTORE', '')
              assert key, 'Provide the permanent signing secret or a prepared APK; ephemeral release keys are disabled'
              p = Path(os.environ['RUNNER_TEMP']) / 'truemotion-preview.jks'
              p.write_bytes(base64.b64decode(key, validate=True))
              p.chmod(0o600)
              Path('signing.properties').write_text(f'storeFile={p}\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n')
          PY
          bash gradlew -PtrueMotionNativePrebuilt=true :app:testCompatDebugUnitTest :app:assembleCompatDebug --no-daemon
      - name: Archive validated unsigned build
        if: inputs.prepare_only
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          out = Path('build/release/validated')
          out.mkdir(parents=True, exist_ok=True)
          built = Path('app/build/outputs/apk/compat/debug/app-compat-debug.apk')
          unsigned = out / 'ci-unsigned.apk'
          with zipfile.ZipFile(built) as src, zipfile.ZipFile(unsigned, 'w') as dst:
              for member in src.infolist():
                  if not re.fullmatch(r'META-INF/(?:MANIFEST\.MF|[^/]+\.(?:SF|RSA|DSA|EC))', member.filename, re.I):
                      dst.writestr(member, src.read(member))
          reports = list(Path('app/build/test-results/testCompatDebugUnitTest').glob('TEST-*.xml'))
          assert reports
          totals = {key: sum(int(ET.parse(p).getroot().get(key, '0')) for p in reports) for key in ('tests', 'failures', 'errors', 'skipped')}
          assert totals['tests'] > 0 and totals['failures'] == totals['errors'] == 0
          for report in reports:
              shutil.copyfile(report, out / report.name)
          (out / 'metadata.json').write_text(json.dumps(dict(source_commit=os.environ['SOURCE_COMMIT'], run_id=os.environ['GITHUB_RUN_ID'], prepare_only=True, sha256=hashlib.file_digest(unsigned.open('rb'), 'sha256').hexdigest(), tests=totals)))
          PY
      - name: Reuse an authenticated successful unsigned build
        if: inputs.validated_run != ''
        run: |
          python3 tools/source_audit.py
          python3 tools/verify_native.py
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          run = os.environ['VALIDATED_RUN']
          assert re.fullmatch(r'[0-9]+', run)
          details = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/actions/runs/{run}']))
          assert details['conclusion'] == 'success' and details['event'] == 'workflow_dispatch'
          assert details['path'] == '.github/workflows/release.yml'
          assert details['head_sha'] == os.environ['SOURCE_COMMIT'], 'Validated run used another source commit'
          assert details['head_repository']['full_name'] == os.environ['GH_REPO']
          PY
          gh run download "$VALIDATED_RUN" --name "TrueMotion-release-${RELEASE_TAG}" --dir build/validated-run
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path('build/validated-run/build/release/validated')
          metadata = json.loads((source / 'metadata.json').read_text())
          assert metadata['source_commit'] == os.environ['SOURCE_COMMIT'] and metadata['run_id'] == os.environ['VALIDATED_RUN'] and metadata['prepare_only'] is True
          assert metadata['tests']['tests'] > 0 and metadata['tests']['failures'] == metadata['tests']['errors'] == 0
          assert hashlib.file_digest((source / 'ci-unsigned.apk').open('rb'), 'sha256').hexdigest() == metadata['sha256']
          apk = Path('app/build/outputs/apk/compat/debug/app-compat-debug.apk')
          apk.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source / 'ci-unsigned.apk', apk)
          reports = Path('app/build/test-results/testCompatDebugUnitTest')
          reports.mkdir(parents=True, exist_ok=True)
          for report in source.glob('TEST-*.xml'):
              shutil.copyfile(report, reports / report.name)
          PY
      - name: Verify and select permanent-signature APK
        if: ${{ !inputs.prepare_only }}
        run: |
          mkdir -p build/release
          built=app/build/outputs/apk/compat/debug/app-compat-debug.apk
          if [[ -n "$PREPARED_COMMIT" ]]; then
            git fetch --no-tags origin "$PREPARED_COMMIT"
            git show "$PREPARED_COMMIT:release.apk" > build/release/prepared.apk
            python3 tools/verify_prepared_apk.py "$built" build/release/prepared.apk "$PREPARED_SHA256"
            cp build/release/prepared.apk "build/release/TrueMotion-${RELEASE_VERSION}-compatible-arm64-debug.apk"
            rm build/release/prepared.apk
          else
            cp "$built" "build/release/TrueMotion-${RELEASE_VERSION}-compatible-arm64-debug.apk"
          fi
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --print-certs "build/release/TrueMotion-${RELEASE_VERSION}-compatible-arm64-debug.apk" > build/release/certificate.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          pin = Path('docs/PREVIEW_CERTIFICATE_SHA256.txt').read_text().strip().lower()
          cert = Path('build/release/certificate.txt').read_text().lower()
          fingerprints = set(re.findall(r'certificate sha-256 digest:\s*([0-9a-f]{64})', cert))
          assert fingerprints == {pin}, 'APK certificate differs from the permanent preview key'
          PY
      - name: Prepare release files
        if: ${{ !inputs.prepare_only }}
        run: |
          mkdir -p build/release
          cp testdata/rig-model-demo.xml build/release/
          cp testdata/shared-depth-demo.xml build/release/
          git archive --format=zip --output="build/release/TrueMotion-${RELEASE_VERSION}-source.zip" HEAD
          git format-patch -1 HEAD --stdout > "build/release/TrueMotion-${RELEASE_VERSION}-source.patch"
          python3 - <<'PY'
          import hashlib, json, os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path('app/build/test-results/testCompatDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'Missing test reports'
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, '0'))
          assert totals['tests'] > 0 and totals['failures'] == 0 and totals['errors'] == 0, totals
          release = Path('build/release')
          (release / 'test-summary.json').write_text(json.dumps(totals) + '\n')
          version = os.environ['RELEASE_VERSION']
          names = [f'TrueMotion-{version}-compatible-arm64-debug.apk', f'TrueMotion-{version}-source.zip', f'TrueMotion-{version}-source.patch', 'rig-model-demo.xml', 'shared-depth-demo.xml']
          (release / 'SHA256SUMS.txt').write_text(''.join(hashlib.file_digest((release / name).open('rb'), 'sha256').hexdigest() + '  ' + name + '\n' for name in names))
          PY
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify "build/release/TrueMotion-${RELEASE_VERSION}-compatible-arm64-debug.apk"
      - name: Upload files and publish preview
        if: ${{ !inputs.prepare_only }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,body > build/release/existing-release.json; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          existing = json.loads(Path('build/release/existing-release.json').read_text())
          assert existing['isDraft'], 'Refusing to replace assets in a published release'
          assert existing['targetCommitish'] == os.environ['SOURCE_COMMIT'], 'Draft points at another source commit'
          Path('build/release/RELEASE_NOTES_RU.md').write_text(existing['body'])
          PY
          else
            notes="docs/RELEASE_${RELEASE_VERSION//./_}_RU.md"
            if [[ ! -f "$notes" && "$RELEASE_VERSION" == *.0 ]]; then
              minor_version="${RELEASE_VERSION%.0}"
              notes="docs/RELEASE_${minor_version//./_}_RU.md"
            fi
            if [[ -f "$notes" ]]; then
              cp "$notes" build/release/RELEASE_NOTES_RU.md
            else
              printf 'True Motion %s (preview)\n' "$RELEASE_VERSION" > build/release/RELEASE_NOTES_RU.md
            fi
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --title "True Motion ${RELEASE_VERSION} (preview)" --notes-file build/release/RELEASE_NOTES_RU.md --draft --prerelease
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('build/release/test-summary.json').read_text())
          notes = Path('build/release/RELEASE_NOTES_RU.md')
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          passed = report['tests'] - report['skipped']
          with notes.open('a') as out:
              out.write(f"\n\nAPK проверен [GitHub Actions]({url}) по исходникам коммита `{os.environ['SOURCE_COMMIT']}`. Проверка CI: {passed} тестов пройдено, {report['skipped']} пропущено, ошибок нет. Сертификат постоянной preview-подписи сверён с закреплённым отпечатком. Для подготовленного APK содержимое приложения побайтово сверено с чистой сборкой CI.\n")
          PY
          gh release upload "$RELEASE_TAG" \
            "build/release/TrueMotion-${RELEASE_VERSION}-compatible-arm64-debug.apk" \
            "build/release/TrueMotion-${RELEASE_VERSION}-source.zip" \
            "build/release/TrueMotion-${RELEASE_VERSION}-source.patch" \
            build/release/rig-model-demo.xml build/release/shared-depth-demo.xml build/release/SHA256SUMS.txt build/release/test-summary.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file build/release/RELEASE_NOTES_RU.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: TrueMotion-release-${{ inputs.tag }}
          path: |
            build/release/
            app/build/reports/tests/testCompatDebugUnitTest/
          if-no-files-found: warn
